<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion samples</title>
<!--
  Two motion questions as live samples, for boards whose later rounds are mostly text (see references/demo-recipes.md,
  "Motion questions in a later round"). Build with:
    python3 scripts/embed_images.py assets/motion-samples.tpl.html out.html --img front=front.png --img back=back.png
  front / back: one real product photo cut out on transparency (front and back of the same piece). The load-in sample
  uses the front six times; swap in six different products on a real board.
-->
<style>
  :root { --paper: #F2F2F0; --ink: #161616; --muted: rgba(22,22,22,.6); --line: rgba(22,22,22,.12); --accent: #E4572E; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ECECEA; color: var(--ink); font: 14.5px/1.5 "Helvetica Neue", Arial, "PingFang SC", sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 500; letter-spacing: -.02em; margin: 0 0 6px; }
  h2 { font-size: 18px; font-weight: 500; margin: 28px 0 6px; }
  .sub { color: var(--muted); max-width: 820px; margin: 0 0 12px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
  .opt { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .opt b { font-weight: 500; }
  .opt p { margin: 0; font-size: 13px; color: var(--muted); }
  .stage { position: relative; aspect-ratio: 16 / 10; background: var(--paper); border-radius: 6px; overflow: hidden; container-type: inline-size; }
  .tag { position: absolute; right: 8px; top: 6px; font: 11px ui-monospace, Menlo, monospace; color: var(--muted); z-index: 5; }
  .replay { position: absolute; left: 8px; bottom: 8px; z-index: 5; font: 12px/1 ui-monospace, Menlo, monospace; background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 6px 10px; cursor: pointer; }

  /* load-in */
  .ld__h { position: absolute; left: 4cqw; top: 7cqw; font-size: 7cqw; font-weight: 500; letter-spacing: -.04em; line-height: .9; white-space: nowrap; }
  .ld__w { display: inline-block; }
  .ld__line { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ld__p { position: absolute; top: 24cqw; width: 14cqw; aspect-ratio: 800 / 920; }
  .ld__p img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* turn */
  .rt { position: absolute; left: 50%; bottom: 0; width: 46%; aspect-ratio: 800 / 920; transform: translateX(-50%); perspective: 900px; }
  .rt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: 50% 60%; }
  .flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.45,0,.2,1); }
  .flip img { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip img + img { transform: rotateY(180deg); }
  .stage.hover:hover .flip, .stage.hover.on .flip { transform: rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) {
    .flip { transition: none; transform: none !important; }
    .flip img { backface-visibility: visible; transition: opacity .4s; }
    .flip img + img { transform: none; opacity: 0; }
    .stage.hover:hover .flip img + img, .stage.hover.on .flip img + img { opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Motion samples</h1>
  <p class="sub">两道动效题的现场小样：首页加载时的入场节奏，以及一张平面产品照片怎么「转」才不像面片。</p>

  <h2>Load-in timing</h2>
  <p class="sub">标题的词和六件产品依次出现，线同时画出来。每张卡片进入画面时播一次，点「重播」再看。</p>
  <div class="grid" id="ld"></div>

  <h2>Turning a flat product photo</h2>
  <p class="sub">x 是对照：把一张图左右压扁再换面，看起来就是一张卡片在翻（被否掉的做法）。a、b 自己转，但换的是真的不同角度；h 只在鼠标移上去时翻（触屏上点一下）。</p>
  <div class="grid" id="rt"></div>
</div>
<script>
const FRONT = '%%IMG_front%%', BACK = '%%IMG_back%%';

// ---------- load-in ----------
const LD = {
  a: { stag: 80, dur: 600, line: 1000, ease: 'cubic-bezier(.16,1,.3,1)', name: 'a · ≈1.2 s, each step slow', note: '“About a second”, with no fast step.' },
  b: { stag: 50, dur: 300, line: 500, ease: 'cubic-bezier(.2,.8,.2,1)', name: 'b · ≈0.65 s, literal “quick”', note: 'Snappy; the kind of motion that reads as fast.' },
  c: { stag: 140, dur: 1000, line: 1800, ease: 'cubic-bezier(.16,1,.3,1)', name: 'c · ≈2 s, silky', note: 'Slower than “about a second”.' },
};
const xs = [6, 21, 36, 51, 66, 81];
document.getElementById('ld').innerHTML = Object.entries(LD).map(([k, p]) => `
  <div class="opt"><b>${p.name}</b>
    <div class="stage ld" data-ld="${k}">
      <svg class="ld__line" viewBox="0 0 100 62.5" preserveAspectRatio="none"><path d="M -2 34 C 18 26, 34 44, 52 37 S 84 27, 102 33" fill="none" stroke="var(--accent)" stroke-width=".55" stroke-linecap="round" pathLength="1"/></svg>
      <div class="ld__h"><span class="ld__w">Every piece</span> <span class="ld__w">starts here</span></div>
      ${xs.map((x) => `<div class="ld__p" style="left:${x}cqw"><img src="${FRONT}" alt=""></div>`).join('')}
      <button class="replay" type="button">↻ 重播</button><span class="tag">${k}</span>
    </div><p>${p.note}</p></div>`).join('');

function playLoadIn(st) {
  const p = LD[st.dataset.ld];
  st.getAnimations({ subtree: true }).forEach((a) => a.cancel());
  [...st.querySelectorAll('.ld__w, .ld__p')].forEach((el, i) => el.animate(
    [{ opacity: 0, transform: 'translateY(1.4cqw)' }, { opacity: 1, transform: 'none' }],
    { duration: p.dur, delay: i * p.stag, easing: p.ease, fill: 'backwards' }));
  st.querySelector('path').animate(
    [{ strokeDasharray: '1 1', strokeDashoffset: 1 }, { strokeDasharray: '1 1', strokeDashoffset: 0 }],
    { duration: p.line, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'both' });
}
// Complete at rest: nothing is hidden before it plays, so a throttled observer can't leave a stage empty.
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { playLoadIn(e.target); io.unobserve(e.target); } }), { threshold: .6 });
document.querySelectorAll('.stage.ld').forEach((st) => io.observe(st));

// ---------- turn ----------
const RT = [
  ['x', 'x · squash flip (comparison)', 'One image squashed with scaleX and swapped at the midpoint: reads as a card. Rejected.'],
  ['a', 'a · angle swap, crossfade', 'Hold 3 s, then crossfade to the other real angle with a small slide.'],
  ['b', 'b · angle swap with perspective', 'The old face turns ~28° away and fades; the new one turns in. No squash.'],
  ['h', 'h · hover card flip', 'Still until the pointer arrives; a visible ~0.8 s card flip to the real back. Tap toggles on touch.'],
];
document.getElementById('rt').innerHTML = RT.map(([k, n, d]) => `
  <div class="opt"><b>${n}</b>
    <div class="stage${k === 'h' ? ' hover' : ''}" data-rt="${k}">
      <div class="rt">${k === 'h' ? `<div class="flip"><img src="${FRONT}" alt=""><img src="${BACK}" alt=""></div>` : `<img src="${FRONT}" alt=""><img src="${BACK}" alt="">`}</div>
      <span class="tag">${k}</span>
    </div><p>${d}</p></div>`).join('');
document.querySelector('.stage.hover').addEventListener('click', (e) => e.currentTarget.classList.toggle('on'));

const easeIO = (x) => x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2;
function rtTick(t) {
  const HOLD = 3, TURN = 1.2, per = HOLD + TURN, k = Math.floor(t / per), f = t - k * per, e = f < HOLD ? 0 : easeIO((f - HOLD) / TURN);
  document.querySelectorAll('.stage[data-rt="x"], .stage[data-rt="a"], .stage[data-rt="b"]').forEach((st) => {
    const [i0, i1] = st.querySelectorAll('img'), cur = k % 2 ? i1 : i0, nxt = k % 2 ? i0 : i1, m = st.dataset.rt;
    if (m === 'x') {
      const side = Math.round(k + e) % 2;
      i0.style.opacity = side ? 0 : 1; i1.style.opacity = side ? 1 : 0;
      i0.style.transform = i1.style.transform = `scaleX(${Math.abs(Math.cos(Math.PI * (k + e))).toFixed(3)})`;
      return;
    }
    if (m === 'a') {
      cur.style.transform = `translateX(${(-3 * e).toFixed(2)}%)`; nxt.style.transform = `translateX(${(3 * (1 - e)).toFixed(2)}%)`;
    } else {
      cur.style.transform = `translateX(${(-4 * e).toFixed(2)}%) rotateY(${(-28 * e).toFixed(2)}deg)`;
      nxt.style.transform = `translateX(${(4 * (1 - e)).toFixed(2)}%) rotateY(${(28 * (1 - e)).toFixed(2)}deg)`;
    }
    cur.style.opacity = (1 - e).toFixed(3); nxt.style.opacity = Math.min(1, e * 1.6).toFixed(3);
    cur.style.zIndex = 2; nxt.style.zIndex = 1;
  });
}
window.rtTick = rtTick; // lets a check render a fixed moment: rtTick(3.55)
(function loop(now) { rtTick(now / 1000); requestAnimationFrame(loop); })(performance.now());
document.addEventListener('click', (e) => { const b = e.target.closest('.replay'); if (b) playLoadIn(b.closest('.stage')); });
</script>
</body>
</html>
